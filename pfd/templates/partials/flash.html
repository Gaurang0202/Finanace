{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-stack">
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show animate__animated animate__fadeInDown" role="alert">
        <i class="fa-solid {{
          'fa-circle-check' if category == 'success' else
          'fa-triangle-exclamation' if category == 'warning' else
          'fa-circle-xmark' if category == 'danger' else
          'fa-circle-info' }} me-2"></i>{{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
    </div>
  {% endif %}
{% endwith %}
