{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block page_title %}Reports{% endblock %}
{% block content %}

<div class="section-card card mx-auto" style="max-width:620px;">
  <div class="section-title">Generate a report</div>
  <div class="section-sub">Choose a period and download in your preferred format</div>

  <form id="reportForm" class="row g-3">
    <div class="col-6">
      <label class="form-label">Year</label>
      <select name="year" id="year" class="form-select">
        {% for y in years %}
        <option value="{{ y }}" {{ 'selected' if y == current_year }}>{{ y }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-6">
      <label class="form-label">Month</label>
      <select name="month" id="month" class="form-select">
        <option value="">Full year</option>
        {% for m in range(1, 13) %}
        <option value="{{ m }}" {{ 'selected' if m == current_month }}>{{ "%02d"|format(m) }}</option>
        {% endfor %}
      </select>
    </div>
  </form>

  <div class="d-flex gap-2 mt-4 flex-wrap">
    <button class="btn btn-outline-secondary flex-grow-1" onclick="downloadReport('csv')"><i class="fa-solid fa-file-csv me-1"></i> CSV</button>
    <button class="btn btn-outline-secondary flex-grow-1" onclick="downloadReport('excel')"><i class="fa-solid fa-file-excel me-1"></i> Excel</button>
    <button class="btn btn-primary flex-grow-1" onclick="downloadReport('pdf')"><i class="fa-solid fa-file-pdf me-1"></i> PDF</button>
  </div>
</div>

<script>
function downloadReport(fmt) {
  const year = document.getElementById('year').value;
  const month = document.getElementById('month').value;
  let url = `/reports/download/${fmt}?year=${year}`;
  if (month) url += `&month=${month}`;
  window.location.href = url;
}
</script>
{% endblock %}
